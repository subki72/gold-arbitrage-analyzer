name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Linter & Syntax Verification
        run: npm run lint

      - name: Run Vitest Suite
        run: npm test

      - name: Verify Production Build
        run: npm run build

  security-scan:
    name: Security Scan (SAST & Container)
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/javascript

      - name: Build Hardened Docker Image
        run: docker build -t gold-arbitrage-analyzer:ci .

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gold-arbitrage-analyzer:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
